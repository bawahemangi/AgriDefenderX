{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Add New Farm" %} - AgriDefenderX{% endblock %}

{% block content %}
<div class="max-w-md mx-auto card p-6">
  <h1 class="font-serif text-2xl font-bold mb-1">{% trans "Add New Farm" %}</h1>
  <p class="text-sm text-[var(--ink-soft)] mb-6">{% trans "Register a new farm to keep track of its crop health." %}</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    
    <div>
      <label class="block text-sm font-semibold mb-1">{% trans "Farm Name" %}</label>
      <input type="text" name="name" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500" placeholder="{% trans 'e.g. Tomato Field' %}">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold mb-1">{% trans "Area (Acres)" %}</label>
        <input type="number" step="0.1" name="area_acres" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500" placeholder="2.5">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">{% trans "District" %}</label>
        <select name="district" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500">
          <option value="">-- {% trans "Select" %} --</option>
          {% for d in districts %}
          <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-semibold mb-1">{% trans "Taluka" %}</label>
        <input type="text" name="taluka" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500">
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">{% trans "Village" %}</label>
        <input type="text" name="village" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500">
      </div>
    </div>

    <div>
      <label class="block text-sm font-semibold mb-1">{% trans "Current Crop" %} <span class="text-xs text-[var(--ink-soft)]">({% trans "optional" %})</span></label>
      <select name="crop" class="w-full rounded-lg border-slate-300 shadow-sm focus:border-green-500 focus:ring-green-500">
        <option value="">-- {% trans "Select" %} --</option>
        {% for c in crops %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="pt-4 flex gap-3">
      <button type="submit" class="flex-1 btn-primary py-2.5 rounded-lg font-bold">{% trans "Save Farm" %}</button>
      <a href="{% url 'accounts:farmer_home' %}" class="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-lg font-bold text-center hover:bg-slate-200 transition">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
{% endblock %}
